<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timesheet Dashboard</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useCallback } = React;

      // Authentication check function
      const checkAuth = async () => {
        try {
          const response = await axios.get("/api/entries.php");
          return true;
        } catch (error) {
          if (error.response?.status === 401) {
            window.location.href = "/login.php";
            return false;
          }
          return true;
        }
      };

      function TimesheetApp() {
        const [entries, setEntries] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [hourlyRate, setHourlyRate] = useState(18.0);
        const [editingRate, setEditingRate] = useState(false);
        // ADDED: Payday state
        const [payingEntry, setPayingEntry] = useState(null);
        const [payAmount, setPayAmount] = useState("");

        // Check authentication on mount
        useEffect(() => {
          checkAuth().then((isAuth) => {
            if (isAuth) {
              loadEntries();
              loadHourlyRate();
            }
          });
        }, []);

        const loadEntries = useCallback(async () => {
          try {
            setLoading(true);
            const response = await axios.get("/api/entries.php");
            setEntries(response.data);
            setError(null);
          } catch (err) {
            if (err.response?.status === 401) {
              window.location.href = "/login.php";
              return;
            }
            setError("Failed to load timesheet data");
            console.error("Error loading entries:", err);
          } finally {
            setLoading(false);
          }
        }, []);

        const loadHourlyRate = useCallback(async () => {
          try {
            const response = await axios.get("/api/settings.php");
            if (response.data.hourly_rate) {
              setHourlyRate(parseFloat(response.data.hourly_rate));
            }
          } catch (err) {
            if (err.response?.status === 401) {
              window.location.href = "/login.php";
              return;
            }
            console.log("No saved hourly rate, using default");
          }
        }, []);

        const saveHourlyRate = async (newRate) => {
          try {
            await axios.post("/api/settings.php", {
              hourly_rate: newRate,
            });
            setHourlyRate(newRate);
          } catch (err) {
            if (err.response?.status === 401) {
              window.location.href = "/login.php";
              return;
            }
            console.error("Error saving hourly rate:", err);
          }
        };

        const addNewEntry = async () => {
          try {
            const today = new Date().toISOString().split("T")[0];
            const newEntry = {
              date: today,
              start_time: "10:30:00",
              lunch_start: "12:00:00",
              lunch_end: "12:00:00",
              end_time: "15:30:00",
              pay_rate: hourlyRate,
              paid: 0.0,
            };

            console.log("Adding new entry:", newEntry);
            const response = await axios.post("/api/entries.php", newEntry);
            console.log("Add response:", response.data);
            loadEntries();
          } catch (err) {
            if (err.response?.status === 401) {
              window.location.href = "/login.php";
              return;
            }
            setError("Failed to add new entry");
            console.error(
              "Error adding entry:",
              err.response?.data || err.message
            );
          }
        };

        const updateEntry = async (id, field, value) => {
          try {
            const entry = entries.find((e) => e.id === id);
            const updatedEntry = { ...entry, [field]: value };
            await axios.put("/api/entries.php", updatedEntry);
            loadEntries();
          } catch (err) {
            if (err.response?.status === 401) {
              window.location.href = "/login.php";
              return;
            }
            setError("Failed to update entry");
            console.error("Error updating entry:", err);
          }
        };

        // ADDED: Handle payday functionality
        const handlePayday = async (id, amount) => {
          try {
            await updateEntry(id, "paid", parseFloat(amount));
            setPayingEntry(null);
            setPayAmount("");
          } catch (err) {
            setError("Failed to process payment");
            console.error("Error processing payment:", err);
          }
        };

        const deleteEntry = async (id) => {
          if (!confirm("Are you sure you want to delete this entry?")) return;

          try {
            await axios.delete("/api/entries.php", { data: { id } });
            loadEntries();
          } catch (err) {
            if (err.response?.status === 401) {
              window.location.href = "/login.php";
              return;
            }
            setError("Failed to delete entry");
            console.error("Error deleting entry:", err);
          }
        };

        const exportCSV = () => {
          const headers = [
            "Date",
            "Start Time",
            "Lunch Start",
            "Lunch End",
            "End Time",
            "Hours Worked",
            "Pay Rate",
            "Amount Earned",
            "Amount Paid",
          ];

          const csvData = entries.map((entry) => [
            entry.date || "",
            formatTime(entry.start_time),
            formatTime(entry.lunch_start),
            formatTime(entry.lunch_end),
            formatTime(entry.end_time),
            calculateHours(entry).toFixed(2),
            `$${parseFloat(entry.pay_rate).toFixed(2)}`,
            `$${calculateAmount(entry).toFixed(2)}`,
            `$${parseFloat(entry.paid).toFixed(2)}`,
          ]);

          const csvContent = [headers, ...csvData]
            .map((row) => row.map((field) => `"${field}"`).join(","))
            .join("\n");

          const blob = new Blob([csvContent], { type: "text/csv" });
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `timesheet-export-${
            new Date().toISOString().split("T")[0]
          }.csv`;
          a.click();
          window.URL.revokeObjectURL(url);
        };

        const parseTime = (timeStr) => {
          if (!timeStr) return 0;
          const [hours, minutes] = timeStr.split(":").map(Number);
          return hours + minutes / 60;
        };

        const formatTime = (timeStr) => {
          if (!timeStr) return "";

          const [hours, minutes] = timeStr.split(":").map(Number);
          const period = hours >= 12 ? "PM" : "AM";
          const displayHours =
            hours === 0 ? 12 : hours > 12 ? hours - 12 : hours;

          return `${displayHours}:${minutes
            .toString()
            .padStart(2, "0")} ${period}`;
        };

        const calculateHours = (entry) => {
          // Skip calculation for entries with missing date or key times
          if (!entry.date || !entry.start_time || !entry.end_time) {
            return 0;
          }

          const start = parseTime(entry.start_time);
          const end = parseTime(entry.end_time);
          const lunchStart = parseTime(entry.lunch_start) || 0;
          const lunchEnd = parseTime(entry.lunch_end) || 0;

          let totalHours = end - start;
          if (lunchStart && lunchEnd && lunchEnd > lunchStart) {
            totalHours -= lunchEnd - lunchStart;
          }

          return Math.max(0, totalHours);
        };

        const calculateAmount = (entry) => {
          return calculateHours(entry) * parseFloat(entry.pay_rate || 0);
        };

        // Calculate totals only for entries with complete data
        const completeEntries = entries.filter(
          (entry) => entry.date && entry.start_time && entry.end_time
        );

        const totalHours = completeEntries.reduce(
          (sum, entry) => sum + calculateHours(entry),
          0
        );

        const totalEarned = completeEntries.reduce(
          (sum, entry) => sum + calculateAmount(entry),
          0
        );
        const totalPaid = completeEntries.reduce(
          (sum, entry) => sum + parseFloat(entry.paid || 0),
          0
        );
        const totalOwed = totalEarned - totalPaid;
        const unpaidHours = totalOwed / hourlyRate;

        const currentYear = new Date().getFullYear();
        const yearlyEntries = completeEntries.filter((entry) => {
          return (
            entry.date && new Date(entry.date).getFullYear() === currentYear
          );
        });
        const yearlyEarned = yearlyEntries.reduce(
          (sum, entry) => sum + calculateAmount(entry),
          0
        );

        if (loading) {
          return <div className="loading">Loading timesheet...</div>;
        }

        return (
          <div className="container">
            <div className="header">
              <h1 className="title">Timesheet Dashboard</h1>
              <div className="header-actions">
                <button onClick={addNewEntry} className="btn btn-primary">
                  + Add Entry
                </button>
                <button onClick={exportCSV} className="btn btn-sm">
                  Export CSV
                </button>
                <a href="/login.php?logout=1" className="logout-btn">
                  Logout
                </a>
              </div>
            </div>

            {error && <div className="error">{error}</div>}

            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-label">Hourly Rate</div>
                <div className="stat-value">
                  {editingRate ? (
                    <input
                      type="number"
                      step="0.01"
                      value={hourlyRate}
                      onChange={(e) =>
                        setHourlyRate(parseFloat(e.target.value) || 0)
                      }
                      onBlur={() => {
                        setEditingRate(false);
                        saveHourlyRate(hourlyRate);
                      }}
                      onKeyPress={(e) => {
                        if (e.key === "Enter") {
                          setEditingRate(false);
                          saveHourlyRate(hourlyRate);
                        }
                      }}
                      className="rate-input"
                      autoFocus
                    />
                  ) : (
                    <span
                      className="hourly-rate"
                      onClick={() => setEditingRate(true)}
                    >
                      ${hourlyRate.toFixed(2)}
                    </span>
                  )}
                </div>
              </div>

              <div className="stat-card">
                <div className="stat-label">Total Hours</div>
                <div className="stat-value">{totalHours.toFixed(1)}h</div>
              </div>

              <div className="stat-card">
                <div className="stat-label">Total Earned</div>
                <div className="stat-value">${totalEarned.toFixed(2)}</div>
              </div>

              <div className="stat-card">
                <div className="stat-label">$ Owed - taxes</div>
                <div
                  className={`stat-value ${
                    totalOwed >= 0 ? "amount-positive" : "amount-negative"
                  }`}
                >
                  ${totalOwed.toFixed(2)}
                </div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Unpaid Hours</div>
                <div
                  className={`stat-value ${
                    unpaidHours >= 0 ? "amount-positive" : "amount-negative"
                  }`}
                >
                  {unpaidHours.toFixed(1)}h
                </div>
              </div>
              <div className="stat-card">
                <div className="stat-label">{currentYear} Gross Earnings</div>
                <div className="stat-value">${yearlyEarned.toFixed(2)}</div>
              </div>
            </div>

            <div className="table-container">
              <table className="table">
                <thead>
                  <tr>
                    <th className="col-date">Date</th>
                    <th className="col-start_time">Start</th>
                    <th className="col-lunch_start">Lunch Start</th>
                    <th className="col-lunch_end">Lunch End</th>
                    <th className="col-end_time">End</th>
                    <th className="col-hours">Hours</th>
                    <th className="col-pay_rate">Rate</th>
                    <th className="col-earned">Earned</th>
                    <th className="col-paid">Paid</th>
                    <th className="col-status">Status</th>
                    <th className="col-actions">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {entries.map((entry) => {
                    const hours = calculateHours(entry);
                    const pay = calculateAmount(entry);
                    const paidAmount = parseFloat(entry.paid) || 0;
                    const isComplete =
                      entry.date && entry.start_time && entry.end_time;

                    return (
                      <tr
                        key={entry.id}
                        className={`${!isComplete ? "new-entry" : ""} ${
                          paidAmount > 0 ? "paid-row" : ""
                        }`}
                      >
                        <td>
                          <EditableCell
                            value={entry.date || ""}
                            placeholder="--/--/2025"
                            onSave={(value) =>
                              updateEntry(entry.id, "date", value)
                            }
                            type="date"
                          />
                        </td>
                        <td>
                          <EditableCell
                            value={formatTime(entry.start_time)}
                            onSave={(value) => {
                              const [time] = value.split(" ");
                              const [hours, minutes] = time.split(":");
                              const hour24 =
                                value.includes("PM") && hours !== "12"
                                  ? parseInt(hours) + 12
                                  : value.includes("AM") && hours === "12"
                                  ? 0
                                  : parseInt(hours);
                              updateEntry(
                                entry.id,
                                "start_time",
                                `${hour24}:${minutes}:00`
                              );
                            }}
                          />
                        </td>
                        <td>
                          <EditableCell
                            value={formatTime(entry.lunch_start)}
                            onSave={(value) => {
                              const [time] = value.split(" ");
                              const [hours, minutes] = time.split(":");
                              const hour24 =
                                value.includes("PM") && hours !== "12"
                                  ? parseInt(hours) + 12
                                  : value.includes("AM") && hours === "12"
                                  ? 0
                                  : parseInt(hours);
                              updateEntry(
                                entry.id,
                                "lunch_start",
                                `${hour24}:${minutes}:00`
                              );
                            }}
                          />
                        </td>
                        <td>
                          <EditableCell
                            value={formatTime(entry.lunch_end)}
                            onSave={(value) => {
                              const [time] = value.split(" ");
                              const [hours, minutes] = time.split(":");
                              const hour24 =
                                value.includes("PM") && hours !== "12"
                                  ? parseInt(hours) + 12
                                  : value.includes("AM") && hours === "12"
                                  ? 0
                                  : parseInt(hours);
                              updateEntry(
                                entry.id,
                                "lunch_end",
                                `${hour24}:${minutes}:00`
                              );
                            }}
                          />
                        </td>
                        <td>
                          <EditableCell
                            value={formatTime(entry.end_time)}
                            onSave={(value) => {
                              const [time] = value.split(" ");
                              const [hours, minutes] = time.split(":");
                              const hour24 =
                                value.includes("PM") && hours !== "12"
                                  ? parseInt(hours) + 12
                                  : value.includes("AM") && hours === "12"
                                  ? 0
                                  : parseInt(hours);
                              updateEntry(
                                entry.id,
                                "end_time",
                                `${hour24}:${minutes}:00`
                              );
                            }}
                          />
                        </td>
                        <td className="col-hours">
                          {calculateHours(entry).toFixed(1)}h
                        </td>
                        <td>
                          <EditableCell
                            value={`$${parseFloat(entry.pay_rate).toFixed(2)}`}
                            onSave={(value) => {
                              const numericValue = parseFloat(
                                value.replace("$", "")
                              );
                              updateEntry(entry.id, "pay_rate", numericValue);
                            }}
                          />
                        </td>
                        <td className="col-earned amount-cell">
                          ${calculateAmount(entry).toFixed(2)}
                        </td>
                        <td>
                          <EditableCell
                            value={`$${parseFloat(entry.paid).toFixed(2)}`}
                            onSave={(value) => {
                              const numericValue = parseFloat(
                                value.replace("$", "")
                              );
                              updateEntry(entry.id, "paid", numericValue);
                            }}
                          />
                        </td>
                        <td>
                          <span
                            className={`status-badge ${
                              paidAmount > 0 ? "status-paid" : "status-pending"
                            }`}
                          >
                            {paidAmount > 0
                              ? `Paid $${paidAmount.toFixed(2)}`
                              : "Pending"}
                          </span>
                        </td>
                        <td>
                          <div className="actions">
                            {paidAmount === 0 &&
                              (payingEntry === entry.id ? (
                                <div className="payday-input">
                                  <span>$</span>
                                  <input
                                    type="number"
                                    step="0.01"
                                    value={payAmount}
                                    onChange={(e) =>
                                      setPayAmount(e.target.value)
                                    }
                                    placeholder={
                                      isComplete ? pay.toFixed(2) : "0.00"
                                    }
                                  />
                                  <button
                                    className="btn-success btn-small"
                                    onClick={() =>
                                      handlePayday(
                                        entry.id,
                                        payAmount ||
                                          (isComplete ? pay.toFixed(2) : "0.00")
                                      )
                                    }
                                  >
                                    ✓
                                  </button>
                                  <button
                                    className="btn-danger btn-small"
                                    onClick={() => {
                                      setPayingEntry(null);
                                      setPayAmount("");
                                    }}
                                  >
                                    ✗
                                  </button>
                                </div>
                              ) : (
                                <button
                                  className="btn-success btn-small"
                                  onClick={() => {
                                    setPayingEntry(entry.id);
                                    setPayAmount(
                                      isComplete ? pay.toFixed(2) : "0.00"
                                    );
                                  }}
                                  title="Payday"
                                  disabled={!isComplete}
                                >
                                  💰
                                </button>
                              ))}
                            <button
                              onClick={() => deleteEntry(entry.id)}
                              className="btn-danger btn-small"
                              title="Delete Entry"
                            >
                              🗑️
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      function EditableCell({ value, onSave, placeholder, type = "text" }) {
        const [isEditing, setIsEditing] = useState(false);
        const [editValue, setEditValue] = useState(value);

        const handleSave = () => {
          onSave(editValue);
          setIsEditing(false);
        };

        const handleKeyPress = (e) => {
          if (e.key === "Enter") {
            handleSave();
          } else if (e.key === "Escape") {
            setEditValue(value);
            setIsEditing(false);
          }
        };

        if (isEditing) {
          return (
            <input
              type={type}
              value={editValue}
              onChange={(e) => setEditValue(e.target.value)}
              onBlur={handleSave}
              onKeyDown={handleKeyPress}
              className="edit-input"
              autoFocus
            />
          );
        }

        return (
          <span
            className="editable"
            onClick={() => {
              setIsEditing(true);
              setEditValue(value);
            }}
          >
            {value || placeholder}
          </span>
        );
      }

      // Use createRoot instead of ReactDOM.render
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<TimesheetApp />);
    </script>
  </body>
</html>
